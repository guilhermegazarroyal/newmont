  header h1{margin:0;font-size:1.3rem;color:var(--gold2);letter-spacing:.5px;}
  header .sub{color:var(--muted);font-size:.8rem;margin-top:4px;}
  .lang-switch{display:flex;gap:6px;}
  .lang-switch button{background:var(--bg2);border:1px solid var(--border);color:var(--muted);padding:6px 14px;border-radius:6px;cursor:pointer;font-weight:600;font-size:.8rem;}

  main{padding:24px;max-width:1300px;margin:0 auto;}
  .page{display:none;animation:fade .25s;}
  .page.active{display:block;}
  @keyframes fade{from{opacity:0;}to{opacity:1;}}
  h2.section-title{color:var(--gold2);border-bottom:1px solid var(--border);padding-bottom:8px;margin-top:0;font-size:1.15rem;}
  h3{color:var(--gold);font-size:.95rem;margin-bottom:6px;}
  .grid{display:grid;gap:14px;}
  .grid-2{grid-template-columns:repeat(2,1fr);}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  @media(max-width:900px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}}
  .card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;}
  .card.gold-border{border-color:var(--gold-dim);}
  .kpi{text-align:center;padding:18px 10px;}
  .kpi .val{font-size:1.9rem;font-weight:800;color:var(--gold2);}
  .kpi .lab{font-size:.72rem;color:var(--muted);margin-top:4px;text-transform:uppercase;letter-spacing:.5px;}
  table{width:100%;border-collapse:collapse;font-size:.82rem;}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);}
  th{color:var(--gold2);background:#101216;font-size:.72rem;text-transform:uppercase;letter-spacing:.4px;}
  tr:hover td{background:#1f222a;}
  .badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:.68rem;font-weight:700;text-transform:uppercase;}
  .b-high{background:rgba(224,90,78,.18);color:var(--red);border:1px solid var(--red);}
  .b-med{background:rgba(232,154,61,.18);color:var(--orange);border:1px solid var(--orange);}
  .b-low{background:rgba(91,191,122,.18);color:var(--green);border:1px solid var(--green);}
  .bar-wrap{background:#101216;border-radius:6px;overflow:hidden;height:10px;margin-top:6px;}
  .bar{height:100%;background:linear-gradient(90deg,var(--gold-dim),var(--gold2));}
  ul{margin:8px 0;padding-left:18px;font-size:.85rem;line-height:1.5;}
  li{margin-bottom:4px;}
  .note{font-size:.76rem;color:var(--muted);font-style:italic;margin-top:8px;border-top:1px dashed var(--border);padding-top:8px;}
  .tag{display:inline-block;background:#101216;border:1px solid var(--border);color:var(--muted);font-size:.68rem;padding:2px 8px;border-radius:10px;margin-right:4px;}
  .divider{height:1px;background:var(--border);margin:18px 0;}
  .flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
  .flow .step{background:#101216;border:1px solid var(--gold-dim);border-radius:8px;padding:8px 12px;font-size:.78rem;}
  .flow .arrow{color:var(--gold);font-weight:700;}
  .zone-map{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;}
  .zone-box{border:1px solid var(--border);border-radius:8px;padding:12px;background:#101216;}
  .zone-box .zt{font-weight:700;color:var(--gold2);font-size:.82rem;}
  .zone-box .zd{font-size:.72rem;color:var(--muted);margin-top:4px;}
  footer{text-align:center;padding:20px;color:var(--muted);font-size:.72rem;border-top:1px solid var(--border);}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.72rem;color:var(--muted);margin-top:6px;}
  .legend span{display:flex;align-items:center;gap:4px;}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;}
</style>
</head>

      "This dashboard does not replace legal, medical advice or direct guidance from competent authorities.",
      "The geographic file sent by the user does not cover AMBA or Santa Cruz, preventing generation of an actual georeferenced map for this report."
    ]
  }
}
};

let currentLang = 'pt';
const tabKeys = ['overview','panorama','cerroNegro','mapRef','matrix','digitalCrimes','recs','incident','sources'];

function levelClass(n){
  if(!n) return 'b-med';
  const s=n.toUpperCase();
  if(s.includes('ALT')||s.includes('HIGH')) return 'b-high';
  if(s.includes('BAJ')||s.includes('BAIX')||s.includes('LOW')) return 'b-low';
  return 'b-med';
}

function renderOverview(d){
  return `<h2 class="section-title">${d.h}</h2>
  <div class="grid grid-4">${d.kpis.map(k=>`<div class="card kpi"><div class="val">${k.v}</div><div class="lab">${k.l}</div></div>`).join('')}</div>
  <div class="divider"></div>
  <div class="grid grid-2">
    <div class="card gold-border"><h3>Cerro Negro</h3><ul>${d.text.map(t=>`<li>${t}</li>`).join('')}</ul></div>
    <div class="card gold-border"><h3>AMBA</h3><ul>${d.secondary.map(t=>`<li>${t}</li>`).join('')}</ul></div>
  </div>`;
}

function renderPanorama(d){
  return `<h2 class="section-title">${d.h}</h2>
  <div class="grid grid-4">${d.cards.map(c=>`<div class="card"><h3>${c.t}</h3><ul>${c.items.map(i=>`<li>${i}</li>`).join('')}</ul></div>`).join('')}</div>
  <div class="card gold-border" style="margin-top:14px;">${d.insight}</div>
  <div class="note">${d.note}</div>`;
}

function renderCerroNegro(d){
  return `<h2 class="section-title">${d.h}</h2>
  <div class="card"><h3>${d.timelineTitle}</h3>
  <div class="flow">${d.timeline.map((t,i)=>`<div class="step"><b>${t.d}</b> — ${t.e}</div>${i<d.timeline.length-1?'<span class="arrow">→</span>':''}`).join('')}</div></div>
  <div class="divider"></div>
  <div class="grid grid-2">
    <div class="card gold-border"><h3>Status</h3><ul>${d.status.map(s=>`<li>${s}</li>`).join('')}</ul></div>
    <div class="card gold-border"><h3>Geografia/Logística</h3><ul>${d.geo.map(s=>`<li>${s}</li>`).join('')}</ul></div>
  </div>`;
}

function renderMatrix(d){
  const rows = d.physical.map(r=>`<tr><td>${r.id}</td><td>${r.risco}</td><td>${r.prob}</td><td>${r.imp}</td><td><span class="badge ${levelClass(r.nivel)}">${r.nivel}</span></td><td>${r.detalhe}</td></tr>`).join('');
  const drows = d.digital.map(r=>`<tr><td>${r.risco}</td><td>${r.vuln}</td><td>${r.cons}</td><td><span class="badge ${levelClass(r.nivel)}">${r.nivel}</span></td></tr>`).join('');
  return `<h2 class="section-title">${d.h}</h2>
  <h3>${d.physicalTitle}</h3>
  <div class="card"><table><thead><tr><th>ID</th><th>Risco</th><th>Prob.</th><th>Imp.</th><th>Nível</th><th>Detalhe</th></tr></thead><tbody>${rows}</tbody></table></div>
  <div class="divider"></div>
  <h3>${d.digitalTitle}</h3>
  <div class="card"><table><thead><tr><th>Risco</th><th>Vulnerabilidade</th><th>Consequência</th><th>Nível</th></tr></thead><tbody>${drows}</tbody></table></div>
  <div class="note">${d.note}</div>`;
}

function renderDigitalCrimes(d){
  return `<h2 class="section-title">${d.h}</h2>
  <div class="card gold-border">${d.intro}</div>
  <div class="divider"></div>
  <div class="grid grid-3">${d.sections.map(s=>`<div class="card"><h3>${s.t}</h3><ul>${s.items.map(i=>`<li>${i}</li>`).join('')}</ul></div>`).join('')}</div>
  <div class="divider"></div>
  <h3>${d.gradeTitle}</h3>
  <div class="grid grid-4">${d.grade.map(g=>`<div class="card"><div style="font-size:.82rem;margin-bottom:8px;">${g.v}</div><span class="badge ${levelClass(g.n)}">${g.n}</span></div>`).join('')}</div>
  <div class="note">${d.limitation}</div>`;
}

function renderRecs(d){
  return `<h2 class="section-title">${d.h}</h2>
  <div class="grid grid-2">${d.groups.map(g=>`<div class="card"><h3>${g.t}</h3><ul>${g.items.map(i=>`<li>${i}</li>`).join('')}</ul></div>`).join('')}</div>
  <div class="divider"></div>
  <div class="card" style="border-color:var(--red);"><h3 style="color:var(--red);">⚠</h3><ul>${d.avoid.map(a=>`<li>${a}</li>`).join('')}</ul></div>
  <div class="note">${d.note}</div>`;
}

function renderIncident(d){
  return `<h2 class="section-title">${d.h}</h2>
  <div class="grid grid-3">${d.contacts.map(c=>`<div class="card kpi"><div class="val">${c.n}</div><div class="lab">${c.d}</div></div>`).join('')}</div>
  <div class="divider"></div>
  <div class="card"><div class="flow">${d.flow.map((f,i)=>`<div class="step">${i+1}. ${f}</div>${i<d.flow.length-1?'<span class="arrow">→</span>':''}`).join('')}</div></div>
  <div class="note">${d.note}</div>`;
}

function renderMapRef(d){
  const maps = [
    {q:"Greater+Buenos+Aires,+Argentina", t:"AMBA — Área Metropolitana de Buenos Aires"},
    {q:"Palermo,+Recoleta,+Belgrano,+Puerto+Madero,+Buenos+Aires", t:"CABA — Palermo, Recoleta, Belgrano, Puerto Madero"},
    {q:"Vicente+Lopez+and+San+Isidro,+Buenos+Aires,+Argentina", t:"Zona Norte GBA — Vicente López e San Isidro"},
    {q:"Tigre+and+Pilar,+Buenos+Aires,+Argentina", t:"Zona Norte GBA — Tigre e Pilar"},
    {q:"Ministro+Pistarini+International+Airport,+Ezeiza,+Argentina", t:"Aeroporto Internacional de Ezeiza"},
    {q:"Aeroparque+Jorge+Newbery,+Buenos+Aires", t:"Aeroparque Jorge Newbery"},
    {q:"Perito+Moreno,+Santa+Cruz,+Argentina", t:"Perito Moreno — Santa Cruz"},
    {q:"Ruta+Nacional+40,+Santa+Cruz,+Argentina", t:"RN 40 — acesso à área de Cerro Negro"},
    {q:"Cerro+Negro+Mine,+Santa+Cruz,+Argentina", t:"Mina Cerro Negro — Santa Cruz"}
  ];
  return `<div class="grid grid-2" style="margin-bottom:14px;">
  ${maps.map(m=>`<div class="card" style="padding:0;overflow:hidden;">
    <div style="padding:10px 12px;font-size:.74rem;color:var(--gold2);font-weight:700;background:#101216;border-bottom:1px solid var(--border);">${m.t}</div>
    <iframe title="${m.t}" src="https://www.google.com/maps?q=${m.q}&output=embed" width="100%" height="420" style="border:0;display:block;" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
  </div>`).join('')}
  </div>
  <div class="zone-map">${d.zones.map(z=>`<div class="zone-box"><div class="zt">${z.t}</div><div class="zd">${z.d}</div></div>`).join('')}</div>
  <div class="note">${d.note}</div>`;
}

function renderSources(d){
  return `<h2 class="section-title">${d.h}</h2>
  <div class="grid grid-2">
    <div class="card"><h3>Fontes</h3><ul>${d.sources.map(s=>`<li>${s}</li>`).join('')}</ul></div>
    <div class="card gold-border"><h3>Limitações</h3><ul>${d.limitations.map(s=>`<li>${s}</li>`).join('')}</ul></div>
  </div>`;
}

const renderers = [renderOverview,renderPanorama,renderCerroNegro,renderMapRef,renderMatrix,renderDigitalCrimes,renderRecs,renderIncident,renderSources];

function render(){
  const data = L[currentLang];
  document.getElementById('h-title').textContent = data.title;
  document.getElementById('h-sub').textContent = data.sub;
  document.getElementById('footerText').textContent = data.footer;
  document.documentElement.lang = currentLang==='pt'?'pt-BR':currentLang;

  const nav = document.getElementById('navTabs');
  nav.innerHTML = data.tabs.map((t,i)=>`<button data-idx="${i}" class="${i===activeTab?'active':''}">${t}</button>`).join('');

  const main = document.getElementById('mainContent');
  main.innerHTML = tabKeys.map((k,i)=>`<div class="page ${i===activeTab?'active':''}" id="page-${i}">${renderers[i](data[k])}</div>`).join('');

  nav.querySelectorAll('button').forEach(b=>{
    b.addEventListener('click',()=>{
      activeTab = parseInt(b.dataset.idx);
      render();
    });
  });
}

let activeTab = 0;

document.querySelectorAll('.lang-switch button').forEach(b=>{
  b.addEventListener('click',()=>{
    currentLang = b.dataset.lang;
    document.querySelectorAll('.lang-switch button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    render();
  });
});

render();
</script>
</body>
</html>
